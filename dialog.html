<!DOCTYPE html> <html> <head> <meta charset="UTF-8"> <title>Wii Dialog</title> <link rel="stylesheet" href="wii.css"> </head> <body> <div class="wii-screen"> <header class="wii-top"> <div class="wii-top-left">Wii Menu</div> </header> <main class="wii-menu"> <button class="wii-button" onclick="openDialog()"> Open Wii Dialog </button> </main> </div> <!-- Wii Dialog --> <div id="dialog" class="wii-dialog-overlay"> <div class="wii-dialog"> <div class="wii-dialog-title"> Wii Message </div> <div class="wii-dialog-content"> <div class="wii-dialog-icon"> ℹ </div> <div> Welcome to the Wii-style dialog! </div> </div> <div class="wii-dialog-buttons"> <button class="wii-button" onclick="closeDialog()"> OK </button> </div> </div> </div> <script> function openDialog() { document .getElementById("dialog") .classList.add("show"); } function closeDialog() { document .getElementById("dialog") .classList.remove("show"); } </script> </body> </html>
